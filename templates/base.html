<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}FishID{% endblock %}</title>

  <!-- Tailwind + DaisyUI (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={plugins:[window.daisyui],daisyui:{theme:["ocean","night"]}};</script>

  <!-- Google Material Icons + FontAwesome (already used in your mock-up) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>

<body class="min-h-screen flex flex-col bg-base-200 font-body">

  <!-- ===== Navbar ===== -->
  <nav class="navbar bg-base-100 shadow-md">
    <div class="flex-1">
      <a href="/" class="btn btn-ghost normal-case text-xl gap-2">
        <span class="material-symbols-outlined text-primary-500">water</span> FishID
      </a>
    </div>

    <ul class="menu menu-horizontal px-1 hidden md:flex">
      <li><a href="/">Home</a></li>
      <li><a href="/log">Log</a></li>
      <li><a href="/map">Map</a></li>
      <li><a href="#">About</a></li>
    </ul>

    <!-- mobile dropdown -->
    <div class="dropdown md:hidden">
      <label tabindex="0" class="btn btn-ghost"><span class="material-symbols-outlined">menu</span></label>
      <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-40">
        <li><a href="/">Home</a></li>
        <li><a href="/log">Log</a></li>
        <li><a href="/map">Map</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== Page body ===== -->
  <main class="flex-1 container mx-auto p-6">{% block body %}{% endblock %}</main>

  <!-- ===== Footer ===== -->
  <footer class="py-6 text-center text-xs opacity-60 bg-base-100">
    Powered by FishBase • Wikipedia • Groq LLM • Fishial.ai
  </footer>
</body>
</html>
